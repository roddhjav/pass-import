---
include:
  - template: Security/SAST.gitlab-ci.yml

stages:
  - lint
  - tests
  - build
  - install
  - deploy

variables:
  DEBIAN_FRONTEND: noninteractive
  PKGDEST: $CI_PROJECT_DIR/.pkg
  SAST_DEFAULT_ANALYZERS: bandit

# Dependencies definitions
# ------------------------

.lpass: &lpass
  - echo -e '#!/usr/bin/env bash\necho lpass' > /usr/bin/lpass
  - chmod 755 /usr/bin/lpass

.gnome-keyring: &gnome-keyring
  - mkdir -p ~/.local/share/keyrings/
  - cp tests/assets/db/gnome-keyring.keyring ~/.local/share/keyrings/pass-import.keyring

.pip: &pip
  - pip3 install --break-system-packages --upgrade
    build installer setuptools uv rust-just
    cryptography defusedxml dominate PyYAML jsonpath-ng
    pykeepass pypandoc python-magic requests secretstorage zxcvbn-rs-py

.script:
  script:
    - *pip
    - *lpass
    - *gnome-keyring
    - just build
    - dbus-run-session -- just tests
    - just docs
    - just install
    - cd ~
    - pass import --help

.tests:
  extends: .script
  stage: tests
  before_script:
    - apt-get update -q && apt-get install -y pass python3-pip grep wget
      dbus gnome-keyring pandoc

# Jobs definitions
# ----------------

# Code Linters

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine
  script:
    - shellcheck --shell=bash pass_import/import.bash

ruff:
  stage: lint
  image: python:latest
  allow_failure: True
  before_script:
    - pip install uv rust-just
  script:
    - just lint

sast:
  stage: lint

# Code tests

python 3.14:
  image: python:3.14
  extends: .tests
  coverage: '/\d+\%\s*$/'
  artifacts:
    expire_in: 2 days
    paths:
      - htmlcov/
      - share/man/man1/*.1

python 3.13:
  image: python:3.13
  extends: .tests

python 3.12:
  image: python:3.12
  extends: .tests

python 3.11:
  image: python:3.11
  extends: .tests

# Package build

.build:
  stage: build
  dependencies:
    - python 3.14
  artifacts:
    expire_in: 1 day
    paths:
      - $PKGDEST/*

build archlinux:
  extends: .build
  image: registry.gitlab.com/roddhjav/builders/archlinux
  script:
    - sudo pacman -Syu --noconfirm --noprogressbar
    - just build-pkg

.build-dpkg:
  extends: .build
  script:
    - sudo chown -R build:build /builds/
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - sudo apt-get update -q && sudo apt-get build-dep -y .
    - just build-dpkg

build debian:
  extends: .build-dpkg
  image: registry.gitlab.com/roddhjav/builders/debian:13

build ubuntu:
  extends: .build-dpkg
  image: registry.gitlab.com/roddhjav/builders/ubuntu:26.04

build opensuse:
  extends: .build
  image: registry.gitlab.com/roddhjav/builders/opensuse
  script:
    - sudo zypper install -y $(rpmspec -q --buildrequires dists/pass-import.spec)
    - just build-rpm

build fedora:
  extends: .build
  image: registry.gitlab.com/roddhjav/builders/fedora:44
  script:
    - sudo dnf -y builddep dists/pass-import.spec
    - just build-rpm

# Package install & test

.check: &check
  - cd ~
  - pimport --version
  - pass import --help

.install:
  stage: install

install archlinux:
  extends: .install
  image: archlinux
  dependencies:
    - build archlinux
  script:
    - pacman -Syu --noconfirm --noprogressbar
    - pacman -U --noconfirm --noprogressbar $PKGDEST/*.pkg.tar.zst
    - *check

install debian:
  extends: .install
  image: debian:13
  dependencies:
    - build debian
  script:
    - apt-get update -q && apt-get install -y $PKGDEST/*.deb
    - *check

install ubuntu:
  extends: .install
  image: ubuntu:26.04
  dependencies:
    - build ubuntu
  script:
    - apt-get update -q && apt-get install -y $PKGDEST/*.deb
    - *check

install opensuse:
  extends: .install
  image: opensuse/tumbleweed
  dependencies:
    - build opensuse
  script:
    - zypper --non-interactive install --allow-unsigned-rpm $PKGDEST/*.rpm
    - *check

install fedora:
  extends: .install
  image: fedora:44
  dependencies:
    - build fedora
  script:
    - dnf -y install $PKGDEST/*.rpm
    - *check

# Code coverage deployment

pages:
  stage: deploy
  dependencies:
    - python 3.14
  script:
    - mv htmlcov/ public/
  artifacts:
    expire_in: 1 day
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
